# Livraison continue du back : à chaque fusion sur develop, GitHub
# construit l'image Docker de l'API, la publie sur GitHub Container
# Registry (ghcr.io), puis met à jour le conteneur de préproduction
# sur Azure Container Apps.
name: CD back

on:
  push:
    branches: [develop]
  workflow_dispatch: # lancement à la main depuis l'onglet Actions

jobs:
  image-docker:
    runs-on: ubuntu-latest

    # Droits du workflow : publier l'image dans les packages du dépôt
    # et demander un jeton de connexion à Azure (identité fédérée)
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE: ghcr.io/iojka/grand-cinema-back

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Jeton fourni automatiquement par GitHub, aucun secret à créer
      - name: Se connecter à GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Deux étiquettes : le numéro du commit (version précise)
      # et "develop" (dernière version de la préproduction)
      - name: Construire l'image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:develop .

      - name: Publier l'image
        run: docker push --all-tags $IMAGE

      # Connexion à Azure sans mot de passe : Azure fait confiance à ce
      # dépôt, branche develop uniquement (identité id-grandcinema-github)
      - name: Se connecter à Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Nouvelle révision du conteneur avec l'image de ce commit
      - name: Déployer en préproduction
        run: >
          az containerapp update
          --resource-group rg-grandcinema-Sandbox
          --name ca-grandcinema-preprod-fr
          --image $IMAGE:${{ github.sha }}
