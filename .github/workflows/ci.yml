# Intégration continue du back : à chaque push et à chaque pull request
# vers develop ou main, GitHub vérifie la qualité du code et lance les tests.
name: CI back

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest

    # Base PostgreSQL 16 temporaire, comme en local et sur Azure
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grandcinema
          POSTGRES_USER: grandcinema
          POSTGRES_PASSWORD: grandcinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variables de test uniquement (aucun secret ici)
    env:
      SECRET_KEY: cle-uniquement-pour-la-ci
      DEBUG: "False"
      DATABASE_URL: postgres://grandcinema:grandcinema@localhost:5432/grandcinema

    steps:
      # Historique complet : SonarQube Cloud repère le code nouveau
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier la mise en forme (Ruff)
        run: ruff format --check .

      - name: Analyser le code (Ruff)
        run: ruff check .

      - name: Vérifier que les migrations sont à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Préparer les fichiers statiques (comme dans le conteneur)
        run: python manage.py collectstatic --noinput

      - name: Lancer les tests avec la couverture
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Qualité du code et couverture envoyées à SonarQube Cloud (D3 Q1) ;
      # le jeton est un secret du dépôt, jamais écrit dans le code ;
      # action tierce figée sur un commit précis (règle Sonar S7637)
      - name: Analyser la qualité (SonarQube Cloud)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
