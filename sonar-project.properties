# Analyse de la qualité du code par SonarQube Cloud (D3 Q1),
# lancée par la CI GitHub Actions (.github/workflows/ci.yml)
sonar.organization=iojka
sonar.projectKey=iojka_grand-cinema-back
sonar.projectName=grand-cinema-back
# Version de Python du projet (Dockerfile et CI)
sonar.python.version=3.14

# Code analysé : tout le projet, sauf les fichiers générés
sonar.sources=.
sonar.exclusions=**/migrations/**,**/tests/**,**/conftest.py,staticfiles/**
# Tests : dossiers tests/ et fichiers conftest.py
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/conftest.py

# Couverture mesurée par pytest-cov (fichier coverage.xml de la CI)
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=manage.py,config/asgi.py,config/wsgi.py
